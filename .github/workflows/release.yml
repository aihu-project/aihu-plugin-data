name: Publish @aihu-plugin/data

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NPM_REGISTRY: https://registry.npmjs.org

jobs:
  publish:
    name: Verify and publish with npm trusted publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run check:release-version "$RELEASE_TAG"
      - name: Run release gate
        run: bun run check:ci
      - name: Fail closed unless npm trusted publishing is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run check:oidc-auth
      - name: Fail closed if this version is already published
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          view_error="$(mktemp)"
          trap 'rm -f "$view_error"' EXIT
          if npm view "${package_name}@${package_version}" version --registry "$NPM_REGISTRY" >/dev/null 2>"$view_error"; then
            echo "${package_name}@${package_version} is already published; refusing to republish"
            exit 1
          elif grep -Eq 'E404|404 Not Found' "$view_error"; then
            echo "${package_name}@${package_version} is unpublished"
          else
            cat "$view_error"
            exit 1
          fi
      - name: Publish with provenance
        run: npm publish --access public --provenance --registry "$NPM_REGISTRY"
