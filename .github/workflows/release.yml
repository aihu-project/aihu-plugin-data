name: Publish @aihu-plugin/data

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NPM_REGISTRY: https://registry.npmjs.org

jobs:
  publish:
    name: Verify and publish with npm trusted publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run check:release-version "$RELEASE_TAG"
      - name: Run release gate
        run: bun run check:ci
      - name: Fail closed unless npm trusted publishing is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -z "${NPM_TOKEN:-}" || {
            echo 'NPM_TOKEN must be unset; this workflow only publishes through npm trusted publishing (OIDC).'
            exit 1
          }
          auth_config="$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null || true)"
          test -z "$auth_config" -o "$auth_config" = "undefined" || {
            echo 'An npm auth token is configured; refusing to mix token auth with OIDC.'
            exit 1
          }
      - name: Publish with provenance
        run: npm publish --access public --provenance --registry "$NPM_REGISTRY"
